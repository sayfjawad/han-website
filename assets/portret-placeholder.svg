<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="20 60 960 1200" role="img" aria-label="Illustratief portret in silhouet">
  <title>Portret in silhouet</title>
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="1250">
      <stop offset="0" stop-color="#3d3d40"/>
      <stop offset="0.5" stop-color="#1e1e20"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.2" cy="0.14" r="0.66">
      <stop offset="0" stop-color="#2f7fdc" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2f7fdc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.84" cy="0.88" r="0.62">
      <stop offset="0" stop-color="#8f47b8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8f47b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ea4ec" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#3a76c8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3a76c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="330" y1="200" x2="700" y2="1060">
      <stop offset="0" stop-color="#eef4ff" stop-opacity="0.92"/>
      <stop offset="0.2" stop-color="#b3d0ff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#5892e8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2f6ad0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="380" y1="260" x2="820" y2="1180">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="0.45" stop-color="#151517"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <radialGradient id="inner" gradientUnits="userSpaceOnUse" cx="420" cy="430" r="300">
      <stop offset="0" stop-color="#cfe0f5" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#8fb0d8" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nekSchaduw" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="920">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="mist" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- profielcontour, naar links kijkend, licht van links -->
    <path id="contour" d="M 568 280
      C 664 302 712 372 716 452
      C 720 516 704 564 672 596
      C 654 620 640 646 634 678
      C 638 722 642 756 650 780
      C 714 804 830 858 938 930
      C 1010 986 1050 1082 1064 1250
      L -60 1250
      C 20 1076 120 992 224 950
      C 328 910 434 872 486 806
      C 492 656 470 648 442 636
      C 426 630 408 622 390 606
      C 385 598 387 590 386 582
      C 384 574 374 568 368 562
      C 372 556 376 550 374 544
      C 370 536 366 530 366 522
      C 356 518 348 512 346 502
      C 348 486 366 474 386 466
      C 396 458 390 450 392 442
      C 394 404 414 348 452 320
      C 486 288 530 276 568 280 Z"/>

    <!-- zachte haartint over schedel en achterhoofd -->
    <radialGradient id="haarTint" gradientUnits="userSpaceOnUse" cx="690" cy="330" r="400">
      <stop offset="0" stop-color="#000000" stop-opacity="0.56"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="knip"><use href="#contour"/></clipPath>
  </defs>

  <rect width="1000" height="1250" fill="url(#bg)"/>
  <rect width="1000" height="1250" fill="url(#glowBlue)"/>
  <rect width="1000" height="1250" fill="url(#glowViolet)"/>

  <!-- atmosferische gloed links achter de figuur -->
  <ellipse cx="400" cy="600" rx="420" ry="520" fill="url(#halo)"/>

  <!-- wijd uitwaaierend licht -->
  <g fill="url(#rim)" opacity="0.26" filter="url(#mist)" transform="translate(-30 -12)">
    <use href="#contour"/>
  </g>

  <!-- zachte randgloed -->
  <g fill="url(#rim)" filter="url(#soft)" transform="translate(-11 -5)">
    <use href="#contour"/>
  </g>

  <!-- de figuur -->
  <use href="#contour" fill="url(#body)"/>

  <!-- haartint, gezichtslicht en schaduw, binnen de contour -->
  <g clip-path="url(#knip)">
    <rect width="1000" height="1250" fill="url(#haarTint)"/>
    <rect width="1000" height="1250" fill="url(#inner)"/>
    <rect width="1000" height="1250" fill="url(#nekSchaduw)"/>
  </g>
</svg>
